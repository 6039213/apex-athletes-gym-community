name: gym_community

services:
  db:
    image: mysql:8.0
    container_name: gym_community_db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-Apex_Athletes}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - gym_network

  wordpress:
    build:
      context: .
      dockerfile: Dockerfile
    image: gym-community-wordpress:6.9.4-local
    container_name: gym_community_wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-Apex_Athletes}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WP_HOME: ${WP_HOME:-http://localhost:8080}
      WP_SITEURL: ${WP_SITEURL:-http://localhost:8080}
      WP_DEBUG: ${WP_DEBUG:-1}
      WP_DEBUG_LOG: ${WP_DEBUG_LOG:-1}
      WP_DEBUG_DISPLAY: ${WP_DEBUG_DISPLAY:-1}
      SCRIPT_DEBUG: ${SCRIPT_DEBUG:-1}
      WP_MEMORY_LIMIT: ${WP_MEMORY_LIMIT:-256M}
      WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-local}
    volumes:
      - ./:/var/www/html
      - ./wp-config-docker.php:/var/www/html/wp-config.php:ro
      - ./docker/.htaccess:/var/www/html/.htaccess:ro
      - ./docker/php.ini:/usr/local/etc/php/conf.d/docker-local.ini:ro
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    networks:
      - gym_network

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: gym_community_phpmyadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-wordpress}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    networks:
      - gym_network

volumes:
  db_data:

networks:
  gym_network:
    driver: bridge
