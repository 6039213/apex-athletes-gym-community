<Directory /var/www/html>
    AllowOverride All
    Options -Indexes +FollowSymLinks
    Require all granted
</Directory>

<Directory /var/www/html/.git>
    Require all denied
</Directory>

<Directory /var/www/html/docker>
    Require all denied
</Directory>

<Directory /var/www/html/docs>
    Require all denied
</Directory>

<Directory /var/www/html/apex-athletes>
    Require all denied
</Directory>

<Directory /var/www/html/apex-athletes-core>
    Require all denied
</Directory>

<FilesMatch "(?i)^(\.env.*|\.gitignore|\.dockerignore|Dockerfile|docker-compose\.yml|package-lock\.json|wp-config.*\.php)$">
    Require all denied
</FilesMatch>

<FilesMatch "(?i)\.(sql|md|bak|log|bat)$">
    Require all denied
</FilesMatch>
